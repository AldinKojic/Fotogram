<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fotogram</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/x-icon" href="/img/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
      rel="stylesheet"
    />
    <script src="script.js"></script>
  </head>
  <body onload="renderImages()">
    <header class="header-container">
      <div class="page-wrapper">
        <img class="header-logo" src="./img/favicon.png" alt="Logo" />
        <h2>Fotogram</h2>
      </div>
    </header>
    <main>
      <h1>My personal photo album</h1>
      <section class="gallery">
        <div class="gallery-grid" id="gallery-list"></div>
      </section>

      <dialog onclick="closeDialog()" class="photo-dialog" id="dialog-photo">
        <div class="dialog-inner" onclick="prevBubbiling(event)">
          <header class="dialog-header">
            <h2 class="dialog-title" id="dialog-title-text">x</h2>
            <button class="dialog-close-btn" onclick="closeDialog()">X</button>
          </header>
          <figure class="dialog-image-container">
            <img class="dialog-image" id="dialog-image-src" alt="" />
          </figure>
          <footer class="dialog-controls">
            <button class="dialog-btn" onclick="previousPicture()">&lt</button>
            <p id="dialog-index" class="dialog-index"></p>
            <button class="dialog-btn" onclick="nextPicture()">&gt</button>
          </footer>
        </div>
      </dialog>
    </main>
    <footer class="main-footer"><h3>Aldin Kojic</h3></footer>
  </body>
</html>

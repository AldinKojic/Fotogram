<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fotogram</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/x-icon" href="/img/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
      rel="stylesheet"
    />
    <script src="script.js"></script>
  </head>
  <body onload="renderImages()">
    <nav>
      <img class="nav-img" src="./img/favicon.png" alt="Blume" />
      <h2>Fotogram</h2>
    </nav>
    <h1>My personal photo album</h1>

    <section class="img-container">
      <div class="imghey" id="imgList"></div>
    </section>

    <dialog class="dialog-case" id="myDialog">
      <header>
        <h2 class="each-animal" id="animals-names"></h2>
      </header>
      <article class="dialog-pics">
        <img id="modal-picture" alt="" />
      </article>
      <footer class="dialog-footer">
        <button onclick="previousPicture()">Züruck</button>
        <p id="site-number"></p>
        <button onclick="nextPicture()">Weiter</button>
      </footer>
    </dialog>

    <footer class="main-footer"><h3>Aldin Kojic</h3></footer>
  </body>
</html>
